version: '3.8'

services:
  # 1. Core Relay & Queue Gateway Service
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nubra_relay_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
    depends_on:
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    networks:
      - internal_net

  # 2. Redis Caching & State Backend
  redis:
    image: redis:7-alpine
    container_name: nubra_relay_redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2b. Dedicated Redis for order queue: persisted + never evicts jobs.
  redis-queue:
    image: redis:7-alpine
    container_name: nubra_relay_redis_queue
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis_queue_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Tailscale Funnel Zero-Trust Ingress (Activated when TS_AUTHKEY is provided)
  # Exposes the gateway publicly via https://<hostname>.<tailnet>.ts.net
  tailscale:
    image: tailscale/tailscale:latest
    container_name: nubra_relay_tailscale
    hostname: nubra-relay
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./config/tailscale:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
    depends_on:
      - relay
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  tailscale_state:
  redis_queue_data:
